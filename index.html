    <meta property="og:description" content="Резюме QA Engineer: опыт работы, ключевые навыки, сертификаты и контакты.">

    <meta property="og:site_name" content="Kirill Pavlov QA Resume">

    <meta name="twitter:image" content="https://kipa.github.io/profile-photo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <style>
        :root {
            color-scheme: light;
            --text: #0f172a;
            --muted: #475569;
            --line: #dbe3ef;
            --bg: #f3f7ff;
            --card: #ffffff;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
            --action-size: 38px;
            --mono: "IBM Plex Mono", "Ubuntu Mono", "Roboto Mono", "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--mono);
            color: var(--text);
            background: linear-gradient(155deg, #edf3ff 0%, #f8fbff 44%, #edf3ff 100%);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            max-width: 860px;
            margin: 34px auto 44px;
            padding: 0 20px;
        }

        body.compact-layout .container {
            min-height: 100vh;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }

        body.compact-layout .resume {
            width: 100%;
        }

        .liquid-background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .liquid-background .orb-layer {
            position: absolute;
            inset: 0;
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }

        .liquid-background::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(46rem 28rem at 12% 12%, rgba(96, 165, 250, 0.28), transparent 72%),
                radial-gradient(40rem 24rem at 88% 18%, rgba(125, 211, 252, 0.28), transparent 74%),
                radial-gradient(34rem 20rem at 50% 88%, rgba(196, 181, 253, 0.26), transparent 72%);
            filter: blur(6px);
        }

        .liquid-background::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(
                120deg,
                rgba(148, 163, 184, 0.04) 0,
                rgba(148, 163, 184, 0.04) 1px,
                transparent 1px,
                transparent 38px
            );
            opacity: 0.35;
        }

        .glass-orb {
            position: absolute;
            border-radius: 999px;
            filter: blur(3px);
            opacity: 0.56;
            animation: liquidFloat 14s ease-in-out infinite;
        }

        .glass-orb.orb-a {
            top: -8%;
            left: -7%;
            width: 360px;
            height: 360px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.84), rgba(96, 165, 250, 0.52) 64%, rgba(59, 130, 246, 0.12) 100%);
        }

        .glass-orb.orb-b {
            top: 14%;
            right: -8%;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle at 42% 30%, rgba(255, 255, 255, 0.82), rgba(125, 211, 252, 0.5) 62%, rgba(14, 165, 233, 0.14) 100%);
            animation-duration: 18s;
            animation-delay: -3s;
        }

        .glass-orb.orb-c {
            bottom: -14%;
            left: 24%;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle at 52% 38%, rgba(255, 255, 255, 0.86), rgba(196, 181, 253, 0.56) 65%, rgba(129, 140, 248, 0.15) 100%);
            animation-duration: 16s;
        }

        .glass-orb.orb-d {
            top: 46%;
            left: 6%;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle at 46% 34%, rgba(255, 255, 255, 0.78), rgba(147, 197, 253, 0.48) 62%, rgba(59, 130, 246, 0.11) 100%);
            animation-duration: 19s;
            animation-delay: -5s;
        }

        .resume {
            background: linear-gradient(155deg, rgba(255, 255, 255, 0.55) 0%, rgba(248, 252, 255, 0.45) 100%);
            border: 1px solid rgba(255, 255, 255, 0.76);
            border-radius: 16px;
            padding: 30px;
            box-shadow:
                0 24px 55px rgba(15, 23, 42, 0.11),
                inset 0 1px 0 rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(28px) saturate(135%);
            -webkit-backdrop-filter: blur(28px) saturate(135%);
            position: relative;
            overflow: hidden;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes liquidFloat {
            0% {
                transform: translate3d(0, 0, 0) scale(1);
            }
            50% {
                transform: translate3d(0, -26px, 0) scale(1.05);
            }
            100% {
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        @keyframes onlinePulse {
            0% {
                transform: scale(1);
                opacity: 0.95;
            }
            70% {
                transform: scale(1.35);
                opacity: 0.45;
            }
            100% {
                transform: scale(1);
                opacity: 0.95;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .resume::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 4px;
            background: linear-gradient(90deg, #93c5fd 0%, #3b82f6 45%, #2563eb 100%);
        }

        .reveal {
            opacity: 1;
        }

        .resume.ready .reveal {
            opacity: 0;
            animation: fadeInUp 0.42s ease forwards;
        }

        .resume.ready .reveal:nth-child(1) { animation-delay: 0.02s; }
        .resume.ready .reveal:nth-child(2) { animation-delay: 0.08s; }
        .resume.ready .reveal:nth-child(3) { animation-delay: 0.14s; }
        .resume.ready .reveal:nth-child(4) { animation-delay: 0.2s; }
        .resume.ready .reveal:nth-child(5) { animation-delay: 0.26s; }
        .resume.ready .reveal:nth-child(6) { animation-delay: 0.32s; }
        .resume.ready .reveal:nth-child(7) { animation-delay: 0.38s; }

        .skeleton {
            border-radius: 10px;
            color: transparent;
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, #eef2ff 20%, #dbeafe 50%, #eef2ff 80%);
            background-size: 220% 100%;
            animation: shimmer 1.4s linear infinite;
        }

        .skeleton-title {
            height: 38px;
            width: min(92%, 460px);
        }

        .skeleton-line {
            height: 14px;
            width: 100%;
        }

        .skeleton-line.short {
            width: 84%;
        }

        .skeleton-pill {
            width: 110px;
            height: 28px;
            border-radius: 999px;
            border: 0;
            padding: 0;
        }

        .is-skeleton {
            list-style: none;
        }

        .is-skeleton li {
            list-style: none;
        }

        .resume.loading .icon-btn {
            opacity: 0.55;
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            position: relative;
            z-index: 30;
        }

        .identity {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .identity-text {
            min-width: 0;
        }

        .profile-photo-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 0;
            padding: 0;
            margin: 0;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            cursor: zoom-in;
            background: rgba(226, 232, 240, 0.9);
            box-shadow: 0 8px 20px rgba(30, 64, 175, 0.16);
        }

        .profile-photo-button.photo-hidden {
            display: none;
        }

        .profile-photo-skeleton {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, #eef2ff 20%, #dbeafe 50%, #eef2ff 80%);
            background-size: 220% 100%;
            animation: shimmer 1.4s linear infinite;
            z-index: 1;
        }

        .profile-photo-skeleton.hidden {
            display: none;
        }

        .profile-photo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.86);
            background: rgba(226, 232, 240, 0.9);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .profile-photo.is-visible {
            opacity: 1;
        }

        .profile-photo-button:focus-visible {
            outline: 2px solid rgba(37, 99, 235, 0.8);
            outline-offset: 3px;
        }

        .actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            right: -10px !important;
            flex-shrink: 0;
            z-index: 24;
        }

        .actions-wrap {
            position: relative;
            flex-shrink: 0;
            z-index: 50;
        }

        .menu-toggle {
            display: none !important;
        }

        h1 {
            margin: 0;
            font-size: 1.58rem;
            line-height: 1.1;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .role {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .role.skeleton-line.short {
            width: min(88%, 340px);
        }

        .role-row {
            margin-top: 4px;
            display: inline-flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            row-gap: 4px;
            min-height: 18px;
        }

        .status-inline {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #2563eb;
            font-size: 0.86rem;
            line-height: 0.5;
            transform: translateY(-1px);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.16);
            animation: onlinePulse 1.9s ease-in-out infinite;
            flex-shrink: 0;
        }

        .status-inline.hidden {
            display: none;
        }

        .status-company {
            font-weight: 500;
        }

        .status-company-link {
            color: inherit;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
            text-decoration-color: rgba(37, 99, 235, 0.5);
            transition: text-decoration-color 0.16s ease, color 0.16s ease;
        }

        .status-company-link:hover {
            color: #1d4ed8;
            text-decoration-color: currentColor;
        }

        .status-skeleton {
            width: min(210px, 70%);
            height: 14px;
            border: 0;
            border-radius: 4px;
            margin-top: 0;
            padding: 0;
        }

        .icon-btn {
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1d4ed8;
            width: var(--action-size);
            height: var(--action-size);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            transform: translateY(-1px);
            background: #dbeafe;
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.2);
        }

        .icon-btn:disabled {
            opacity: 0.65;
            cursor: progress;
            transform: none;
            box-shadow: none;
        }

        .icon-link {
            text-decoration: none;
        }

        .icon-link.hidden-link {
            display: none;
        }

        .lang-btn {
            width: var(--action-size);
            min-width: var(--action-size);
            padding: 0;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            position: relative;
        }

        .lang-btn .lang-label {
            line-height: 1;
            transition: opacity 0.12s ease;
        }

        .lang-btn .lang-loader {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 1.7px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            opacity: 0;
            animation: spin 0.72s linear infinite;
            transition: opacity 0.12s ease;
            pointer-events: none;
        }

        .lang-btn.is-loading .lang-label {
            opacity: 0;
        }

        .lang-btn.is-loading .lang-loader {
            opacity: 1;
        }

        .contacts {
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .contacts li {
            padding: 0;
            display: inline-flex;
            align-items: center;
        }

        .contacts li + li::before {
            content: "|";
            color: #94a3b8;
            margin: 0 8px;
        }

        .contacts.is-skeleton li + li::before {
            content: none;
            margin: 0;
        }

        .contacts.is-skeleton {
            gap: 8px;
        }

        .contacts a,
        .contacts span {
            color: #334155;
            text-decoration-line: underline;
            text-decoration-color: rgba(100, 116, 139, 0.7);
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
            transition: color 0.18s ease, text-decoration-color 0.18s ease;
        }

        .contacts a:hover {
            color: #1d4ed8;
            text-decoration-color: currentColor;
        }

        .contacts span:hover {
            color: #0f172a;
            text-decoration-color: rgba(15, 23, 42, 0.7);
        }

        .compact-hidden {
            display: none !important;
        }

        .cursor-tooltip {
            position: fixed;
            left: -9999px;
            top: -9999px;
            z-index: 130;
            padding: 7px 10px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.44);
            background: linear-gradient(155deg, rgba(255, 255, 255, 0.94), rgba(241, 245, 255, 0.92));
            box-shadow: 0 16px 30px rgba(15, 23, 42, 0.18);
            backdrop-filter: blur(11px);
            -webkit-backdrop-filter: blur(11px);
            color: #0f172a;
            font-size: 0.74rem;
            line-height: 1.2;
            letter-spacing: 0.01em;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translate3d(0, 0, 0) scale(0.96);
            transform-origin: left top;
            transition: opacity 0.12s ease, transform 0.14s ease;
        }

        .cursor-tooltip.visible {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
        }

        .language-blur-transition-text {
            filter: blur(2.4px);
            opacity: 0.72;
            transition: filter 0.18s ease, opacity 0.18s ease;
            will-change: filter, opacity;
        }

        section {
            border-top: 1px solid #e2e8f0;
            margin-top: 22px;
            padding-top: 22px;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        h2::before {
            content: "//";
            color: #2563eb;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0;
        }

        p {
            margin: 0;
        }

        .skills {
            margin: 0;
            padding-left: 18px;
        }

        .skills li + li {
            margin-top: 4px;
        }

        .timeline {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 16px;
        }

        .timeline li {
            border-left: 1px solid #93c5fd;
            padding-left: 16px;
            position: relative;
        }

        .timeline li::before {
            content: "";
            position: absolute;
            left: -5px;
            top: 5px;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            background: #dbeafe;
            border: 1px solid #3b82f6;
            box-shadow: none;
        }

        .timeline h3 {
            margin: 0;
            font-size: 1rem;
        }

        .timeline .meta {
            margin: 4px 0 6px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .timeline .meta a {
            color: inherit;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
            text-decoration-color: rgba(100, 116, 139, 0.62);
            transition: color 0.16s ease, text-decoration-color 0.16s ease;
        }

        .timeline .meta a:hover {
            color: #1d4ed8;
            text-decoration-color: currentColor;
        }

        .timeline .description {
            margin: 0;
            color: #1f2937;
        }

        .skills.is-skeleton {
            padding-left: 0;
            display: grid;
            gap: 8px;
        }

        .skills.is-skeleton li:nth-child(2) { width: 92%; }
        .skills.is-skeleton li:nth-child(3) { width: 84%; }
        .skills.is-skeleton li:nth-child(4) { width: 76%; }

        .timeline.is-skeleton {
            gap: 12px;
        }

        .timeline.is-skeleton li {
            border: 0;
            padding-left: 0;
            display: grid;
            gap: 7px;
        }

        .timeline.is-skeleton li::before {
            display: none;
        }

        .timeline.is-skeleton li .skeleton-line:first-child {
            width: 58%;
            height: 15px;
        }

        .timeline.is-skeleton li .skeleton-line:last-child {
            width: 86%;
        }

        .empty {
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .photo-modal {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .photo-modal[hidden] {
            display: none;
        }

        .photo-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.74);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .photo-modal-content {
            position: relative;
            z-index: 1;
            max-width: min(86vw, 520px);
            max-height: min(82vh, 520px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 55px rgba(15, 23, 42, 0.36);
            background: #fff;
        }

        .photo-modal-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 2;
            border: 1px solid rgba(191, 219, 254, 0.85);
            background: rgba(239, 246, 255, 0.95);
            color: #1d4ed8;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
        }

        body.modal-open {
            overflow: hidden;
        }

        @media (prefers-reduced-motion: reduce) {
            .skeleton,
            .resume.ready .reveal,
            .glass-orb,
            .status-dot {
                animation: none !important;
            }

            .resume.ready .reveal {
                opacity: 1;
            }

            .language-blur-transition-text {
                filter: none;
                opacity: 1;
                transition: none;
            }
        }

        @media (max-width: 640px) {
            .container {
                margin-top: 20px;
            }

            .resume {
                padding: 22px;
                border-radius: 14px;
            }

            .profile-photo-button,
            .profile-photo {
                width: 52px;
                height: 52px;
            }

            .glass-orb {
                opacity: 0.42;
                filter: blur(3px);
            }

            .glass-orb.orb-a,
            .glass-orb.orb-b {
                width: 260px;
                height: 260px;
            }

            .glass-orb.orb-c {
                width: 300px;
                height: 300px;
                left: 10%;
            }

            h1 {
                font-size: 1.45rem;
            }

            .header {
                gap: 10px;
            }

            .menu-toggle {
                display: inline-flex !important;
            }

            .actions {
                display: none;
                position: absolute;
                right: 0;
                top: calc(100% + 8px);
                flex-direction: column;
                gap: 8px;
                padding: 9px;
                border-radius: 12px;
                border: 1px solid rgba(191, 219, 254, 0.88);
                background: rgba(255, 255, 255, 0.86);
                box-shadow: 0 14px 26px rgba(15, 23, 42, 0.16);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                z-index: 60;
            }

            .actions.open {
                display: flex;
            }

            .contacts {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .contacts li + li::before {
                content: none;
                margin: 0;
            }
        }

        @media (hover: none), (pointer: coarse) {
            .cursor-tooltip {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="liquid-background" aria-hidden="true">
        <span class="orb-layer" data-depth="0.75"><span class="glass-orb orb-a"></span></span>
        <span class="orb-layer" data-depth="-0.55"><span class="glass-orb orb-b"></span></span>
        <span class="orb-layer" data-depth="0.4"><span class="glass-orb orb-c"></span></span>

    <main class="container">

            <header class="header reveal">
                <div class="identity">
                    <button id="profilePhotoButton" class="profile-photo-button" type="button" aria-label="Открыть фото профиля">

                        >
                    </button>
                    <div class="identity-text">
                        <h1 id="name" class="skeleton skeleton-title"></h1>
                        <div class="role-row">
                            <p class="role skeleton skeleton-line short" id="title"></p>
                            <span id="currentStatus" class="status-inline skeleton status-skeleton"></span>
                        </div>
                    </div>
                </div>
                <div class="actions-wrap" data-no-translate>
                    <button id="actionsMenuButton" class="icon-btn menu-toggle" type="button" aria-label="Открыть меню действий" aria-expanded="false" aria-controls="actionsPanel">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>

                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M21.2 4.8L18.3 19.1C18.1 20.1 17.5 20.3 16.7 19.9L11.9 16.4L9.6 18.6C9.4 18.8 9.2 19 8.8 19L9.1 14.1L17.9 6.2C18.3 5.9 17.8 5.7 17.3 6L6.5 12.8L1.8 11.3C0.8 11 0.8 10.3 2 9.8L20.5 3C21.3 2.7 22 3.2 21.7 4.3L21.2 4.8Z" fill="currentColor"></path>
                            </svg>
                        </a>
                        <button id="toggleLanguage" class="icon-btn lang-btn" type="button" aria-label="Переключить язык на английский">

                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">

                                <path d="M5 16.5V18.2C5 19.1941 5.80589 20 6.8 20H17.2C18.1941 20 19 19.1941 19 18.2V16.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>
            <ul class="contacts is-skeleton reveal" id="contacts">
                <li class="skeleton skeleton-pill"></li>
                <li class="skeleton skeleton-pill"></li>
                <li class="skeleton skeleton-pill"></li>
                <li class="skeleton skeleton-pill"></li>
            </ul>

            <section id="summarySection" class="reveal">
                <h2>О себе</h2>
                <p id="summary" class="skeleton skeleton-line"></p>
            </section>

            <section id="skillsSection" class="reveal">
                <h2>Ключевые навыки</h2>
                <ul class="skills is-skeleton" id="skills">
                    <li class="skeleton skeleton-line"></li>
                    <li class="skeleton skeleton-line"></li>
                    <li class="skeleton skeleton-line"></li>
                    <li class="skeleton skeleton-line"></li>
                </ul>
            </section>

            <section id="experienceSection" class="reveal">
                <h2>Опыт работы</h2>
                <ul class="timeline is-skeleton" id="experience">
                    <li>
                        <span class="skeleton skeleton-line"></span>
                        <span class="skeleton skeleton-line"></span>
                    </li>
                    <li>
                        <span class="skeleton skeleton-line"></span>
                        <span class="skeleton skeleton-line"></span>
                    </li>
                </ul>

            <section id="educationSection" class="reveal">
                <h2>Образование</h2>
                <ul class="timeline is-skeleton" id="education">
                    <li>
                        <span class="skeleton skeleton-line"></span>
                        <span class="skeleton skeleton-line"></span>
                    </li>
                </ul>
            </section>

            <section id="certificationsSection" class="reveal">
                <h2>Сертификаты</h2>
                <ul class="timeline is-skeleton" id="certifications">

                        <span class="skeleton skeleton-line"></span>
                        <span class="skeleton skeleton-line"></span>
                    </li>

    </main>

    <div id="photoModal" class="photo-modal" hidden data-no-translate>
        <div class="photo-modal-backdrop" data-close-photo></div>
        <button id="photoModalClose" class="photo-modal-close" type="button" aria-label="Закрыть фото">✕</button>
        <figure class="photo-modal-content">
            <img id="photoModalImage" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Фото профиля">
        </figure>
    </div>
    <div id="cursorTooltip" class="cursor-tooltip" aria-hidden="true"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        let loadedResume = null;
        let currentLanguage = "ru";
        let isTranslating = false;
        let baseTitle = "QA Engineer Resume";
        const DEFAULT_PROFILE_PHOTO = "./profile-photo.jpg";
        let currentPhotoThumbnailSource = "";
        let currentPhotoModalSource = "";
        const originalTextByNode = new Map();
        const translatedCache = new Map();
        const LANGUAGE_BLUR_IN_DURATION = 180;
        const LANGUAGE_BLUR_OUT_DURATION = 180;
        const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        const liquidBackground = document.querySelector(".liquid-background");
        const parallaxLayers = liquidBackground ? [...liquidBackground.querySelectorAll(".orb-layer[data-depth]")] : [];
        let parallaxPointerX = 0;
        let parallaxPointerY = 0;
        let parallaxScrollY = 0;
        let currentParallaxX = 0;
        let currentParallaxY = 0;
        let parallaxFrame = null;
        const actionsMenuButton = document.getElementById("actionsMenuButton");
        const actionsPanel = document.getElementById("actionsPanel");
        const cursorTooltip = document.getElementById("cursorTooltip");
        const finePointerQuery = window.matchMedia("(hover: hover) and (pointer: fine)");
        const FULL_RESUME_SECTION_IDS = [
            "skillsSection",
            "experienceSection",
            "educationSection",
            "certificationsSection"
        ];
        const DEFAULT_BUTTON_TOOLTIPS = {
            profilePhoto: { ru: "Открыть фото", en: "Open photo" },
            actionsMenu: { ru: "Открыть меню", en: "Open menu" },
            telegram: { ru: "Открыть Telegram", en: "Open Telegram" },
            languageToEn: { ru: "Переключить на английский", en: "Switch to English" },
            languageToRu: { ru: "Переключить на русский", en: "Switch to Russian" },
            downloadPdf: { ru: "Скачать PDF", en: "Download PDF" },
            downloadPdfLoading: { ru: "Генерация PDF...", en: "Generating PDF..." },
            closePhoto: { ru: "Закрыть фото", en: "Close photo" },
            // Legacy fallback keys for older resume.json versions.
            downloadPdfLoadingRu: "Генерация PDF...",
            downloadPdfLoadingEn: "Generating PDF..."
        };
        let buttonTooltips = { ...DEFAULT_BUTTON_TOOLTIPS };
        let resumeInfoLevel = 1;
        let activeTooltipTarget = null;
        let tooltipPointerX = 0;
        let tooltipPointerY = 0;

        function createTimelineItem(item) {
            const li = document.createElement("li");

            const heading = document.createElement("h3");
            heading.textContent = item.position || item.program || item.name || "";
            li.appendChild(heading);

            const meta = document.createElement("p");
            meta.className = "meta";
            const orgName = item.company || item.school || item.issuer || "";
            const isCompanyEntry = Boolean(item.company);
            const orgUrl = isCompanyEntry && typeof item.companyUrl === "string"
                ? item.companyUrl.trim()
                : "";
            const hasValidOrgUrl = /^https?:\/\//i.test(orgUrl);

            if (orgName) {
                if (hasValidOrgUrl) {
                    const orgLink = document.createElement("a");
                    orgLink.href = orgUrl;
                    orgLink.target = "_blank";
                    orgLink.rel = "noopener noreferrer";
                    orgLink.textContent = orgName;
                    orgLink.setAttribute("aria-label", `Открыть сайт компании ${orgName}`);
                    meta.appendChild(orgLink);
                } else {
                    meta.append(orgName);
                }
            }

            if (item.period) {
                if (orgName) {
                    meta.append(" - ");
                }
                meta.append(item.period);
            }
            li.appendChild(meta);

            if (item.description) {
                const description = document.createElement("p");
                description.className = "description";
                description.textContent = item.description;
                li.appendChild(description);
            }

            return li;
        }

        function renderContacts(contacts) {
            const contactsList = document.getElementById("contacts");
            contactsList.classList.remove("is-skeleton");
            contactsList.innerHTML = "";

            contacts.forEach((contact) => {
                const item = document.createElement("li");
                if (contact.href) {
                    const link = document.createElement("a");
                    link.href = contact.href;
                    link.textContent = contact.label;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    setContactTooltipSource(link, contact);
                    item.appendChild(link);
                } else {
                    const text = document.createElement("span");
                    text.textContent = contact.label;
                    setContactTooltipSource(text, contact);
                    item.appendChild(text);
                }
                contactsList.appendChild(item);
            });
        }

        function renderList(id, data) {
            const list = document.getElementById(id);
            list.classList.remove("is-skeleton");
            list.innerHTML = "";
            data.forEach((item) => list.appendChild(createTimelineItem(item)));
        }

        function finishLoadingState() {
            const root = document.getElementById("resumeRoot");
            const name = document.getElementById("name");
            const title = document.getElementById("title");
            const summary = document.getElementById("summary");
            const skills = document.getElementById("skills");
            const status = document.getElementById("currentStatus");

            name.classList.remove("skeleton", "skeleton-title");
            title.classList.remove("skeleton", "skeleton-line", "short");
            summary.classList.remove("skeleton", "skeleton-line");
            skills.classList.remove("is-skeleton");
            status.classList.remove("skeleton", "status-skeleton");

            requestAnimationFrame(() => {
                root.classList.remove("loading");
                root.classList.add("ready");
            });
        }

        function renderCurrentStatus(profile) {
            const status = document.getElementById("currentStatus");
            const company = typeof profile?.currentCompany === "string" ? profile.currentCompany.trim() : "";
            const companyUrl = typeof profile?.currentCompanyUrl === "string" ? profile.currentCompanyUrl.trim() : "";

            status.innerHTML = "";
            status.classList.remove("hidden");

            if (!company) {
                status.classList.add("hidden");
                return;
            }

            const dot = document.createElement("span");
            dot.className = "status-dot";
            status.appendChild(dot);

            const isAbsoluteLink = /^https?:\/\//i.test(companyUrl);
            const label = document.createElement(isAbsoluteLink ? "a" : "span");
            label.className = `status-company${isAbsoluteLink ? " status-company-link" : ""}`;
            label.textContent = company;
            if (isAbsoluteLink) {
                label.href = companyUrl;
                label.target = "_blank";
                label.rel = "noopener noreferrer";
                label.setAttribute("aria-label", `Открыть сайт компании ${company}`);
            }
            status.appendChild(label);
        }

        function setProfilePhoto(profile) {
            const photoButton = document.getElementById("profilePhotoButton");
            const photo = document.getElementById("profilePhoto");
            const photoSkeleton = document.getElementById("profilePhotoSkeleton");
            const preferredSource = profile?.photoThumbnail || profile?.photo || DEFAULT_PROFILE_PHOTO;
            const preferredModalSource = profile?.photoModal || profile?.photoFull || preferredSource;
            let fallbackTried = false;

            photoButton.classList.remove("photo-hidden");
            photoSkeleton.classList.remove("hidden");
            photo.classList.remove("is-visible");
            photoButton.disabled = true;
            photo.alt = `Фото ${profile?.name || "кандидата"}`;
            currentPhotoThumbnailSource = "";
            currentPhotoModalSource = preferredModalSource;

            photo.onload = () => {
                currentPhotoThumbnailSource = photo.currentSrc || photo.src;
                photo.classList.add("is-visible");
                photoSkeleton.classList.add("hidden");
                photoButton.disabled = false;
            };

            photo.onerror = () => {
                if (!fallbackTried) {
                    fallbackTried = true;
                    photo.src = DEFAULT_PROFILE_PHOTO;
                    return;
                }

                photoSkeleton.classList.add("hidden");
                photo.classList.remove("is-visible");
                photoButton.classList.add("photo-hidden");
                photoButton.disabled = true;
            };

            photo.src = preferredSource;
        }

        function setTelegramLink(profile, contacts) {
            const telegramLink = document.getElementById("telegramLink");
            const directProfileLink = profile?.telegram;
            const contactLink = (contacts || []).find((contact) => {
                return typeof contact?.href === "string" && contact.href.includes("t.me/");
            })?.href;
            const target = directProfileLink || contactLink;

            if (!target) {
                telegramLink.classList.add("hidden-link");
                telegramLink.removeAttribute("href");
                setTooltipText(telegramLink, "");
                return;
            }

            telegramLink.href = target;
            telegramLink.classList.remove("hidden-link");
            setTooltipText(telegramLink, getButtonTooltipText("telegram"));
        }

        function resolveLocalizedText(value, language, fallbackText = "") {
            if (typeof value === "string" && value.trim()) {
                return value.trim();
            }

            if (value && typeof value === "object") {
                const direct = value[language];
                if (typeof direct === "string" && direct.trim()) {
                    return direct.trim();
                }

                const fallbackRu = value.ru;
                if (typeof fallbackRu === "string" && fallbackRu.trim()) {
                    return fallbackRu.trim();
                }

                const fallbackEn = value.en;
                if (typeof fallbackEn === "string" && fallbackEn.trim()) {
                    return fallbackEn.trim();
                }
            }

            return typeof fallbackText === "string" ? fallbackText : "";
        }

        function getButtonTooltipText(key, language = currentLanguage) {
            const fallback = resolveLocalizedText(DEFAULT_BUTTON_TOOLTIPS[key], language, "");
            return resolveLocalizedText(buttonTooltips[key], language, fallback);
        }

        function getDownloadPdfLoadingTooltip(language = currentLanguage) {
            const localizedLoading = getButtonTooltipText("downloadPdfLoading", language);
            if (localizedLoading) {
                return localizedLoading;
            }

            if (language === "en") {
                return getButtonTooltipText("downloadPdfLoadingEn", "en");
            }
            return getButtonTooltipText("downloadPdfLoadingRu", "ru");
        }

        function getContactTooltipText(contact, language) {
            const label = typeof contact?.label === "string" ? contact.label.trim() : "";
            const localized = resolveLocalizedText(contact?.tooltip, language, "");
            if (localized) {
                return localized;
            }

            const directLegacy = language === "en" ? contact?.tooltipEn : contact?.tooltipRu;
            if (typeof directLegacy === "string" && directLegacy.trim()) {
                return directLegacy.trim();
            }

            const fallbackLegacy = language === "en" ? contact?.tooltipRu : contact?.tooltipEn;
            if (typeof fallbackLegacy === "string" && fallbackLegacy.trim()) {
                return fallbackLegacy.trim();
            }

            return label;
        }

        function setContactTooltipSource(target, contact) {
            if (!target) {
                return;
            }

            const tooltipRu = getContactTooltipText(contact, "ru");
            const tooltipEn = getContactTooltipText(contact, "en");
            target.dataset.tooltipRu = tooltipRu;
            target.dataset.tooltipEn = tooltipEn;

            const activeTooltip = currentLanguage === "en"
                ? (tooltipEn || tooltipRu)
                : (tooltipRu || tooltipEn);
            setTooltipText(target, activeTooltip);
        }

        function refreshContactTooltipsForLanguage() {
            const contactElements = document.querySelectorAll("#contacts a, #contacts span");
            contactElements.forEach((element) => {
                const ruTooltip = element.dataset.tooltipRu || "";
                const enTooltip = element.dataset.tooltipEn || "";
                const nextTooltip = currentLanguage === "en"
                    ? (enTooltip || ruTooltip)
                    : (ruTooltip || enTooltip);
                setTooltipText(element, nextTooltip);
            });
        }

        function refreshButtonTooltipsForLanguage() {
            setTooltipText(document.getElementById("profilePhotoButton"), getButtonTooltipText("profilePhoto"));
            setTooltipText(actionsMenuButton, getButtonTooltipText("actionsMenu"));
            setTooltipText(document.getElementById("photoModalClose"), getButtonTooltipText("closePhoto"));
            const telegramLink = document.getElementById("telegramLink");
            if (telegramLink && !telegramLink.classList.contains("hidden-link")) {
                setTooltipText(telegramLink, getButtonTooltipText("telegram"));
            }

            const downloadButton = document.getElementById("downloadPdf");
            if (resumeInfoLevel === 0 || downloadButton?.classList.contains("compact-hidden")) {
                setTooltipText(downloadButton, "");
            } else {
                setTooltipText(downloadButton, getButtonTooltipText("downloadPdf"));
            }

            const languageTooltipKey = currentLanguage === "ru" ? "languageToEn" : "languageToRu";
            setTooltipText(document.getElementById("toggleLanguage"), getButtonTooltipText(languageTooltipKey));
        }

        function applyButtonTooltips(tooltipConfig) {
            const overrides = tooltipConfig?.buttons && typeof tooltipConfig.buttons === "object"
                ? tooltipConfig.buttons
                : {};
            buttonTooltips = { ...DEFAULT_BUTTON_TOOLTIPS, ...overrides };
            refreshButtonTooltipsForLanguage();
        }

        function resolveInfoLevel(value) {
            return Number(value) === 0 ? 0 : 1;
        }

        function applyInformationDensity(meta) {
            resumeInfoLevel = resolveInfoLevel(meta?.infoLevel);
            const hideExtendedSections = resumeInfoLevel === 0;
            document.body.classList.toggle("compact-layout", hideExtendedSections);

            FULL_RESUME_SECTION_IDS.forEach((sectionId) => {
                const section = document.getElementById(sectionId);
                if (section) {
                    section.classList.toggle("compact-hidden", hideExtendedSections);
                }
            });

            const downloadButton = document.getElementById("downloadPdf");
            if (downloadButton) {
                downloadButton.classList.toggle("compact-hidden", hideExtendedSections);
                downloadButton.disabled = hideExtendedSections;
            }

            refreshButtonTooltipsForLanguage();
        }

        function setTooltipText(target, text) {
            if (!target) {
                return;
            }
            const normalizedText = typeof text === "string" ? text.trim() : "";
            if (!normalizedText) {
                target.removeAttribute("data-tooltip");
                if (activeTooltipTarget === target) {
                    hideCursorTooltip();
                }
                return;
            }

            target.dataset.tooltip = normalizedText;
            if (activeTooltipTarget === target && cursorTooltip) {
                cursorTooltip.textContent = normalizedText;
                updateCursorTooltipPosition();
            }
        }

        function setLanguageButtonText(button, value) {
            if (!button) {
                return;
            }

            const label = button.querySelector(".lang-label");
            if (label) {
                label.textContent = value;
                return;
            }
            button.textContent = value;
        }

        function setLanguageButtonLoading(button, isLoading) {
            if (!button) {
                return;
            }

            button.classList.toggle("is-loading", Boolean(isLoading));
            button.setAttribute("aria-busy", isLoading ? "true" : "false");
        }

        function updateCursorTooltipPosition() {
            if (!cursorTooltip || !activeTooltipTarget) {
                return;
            }

            const offset = 14;
            const viewportGap = 10;
            const tooltipRect = cursorTooltip.getBoundingClientRect();
            let nextX = tooltipPointerX + offset;
            let nextY = tooltipPointerY + offset;

            if (nextX + tooltipRect.width + viewportGap > window.innerWidth) {
                nextX = tooltipPointerX - tooltipRect.width - offset;
            }
            if (nextY + tooltipRect.height + viewportGap > window.innerHeight) {
                nextY = tooltipPointerY - tooltipRect.height - offset;
            }

            nextX = Math.max(viewportGap, nextX);
            nextY = Math.max(viewportGap, nextY);
            cursorTooltip.style.left = `${Math.round(nextX)}px`;
            cursorTooltip.style.top = `${Math.round(nextY)}px`;
        }

        function showCursorTooltip(target, clientX, clientY) {
            if (!cursorTooltip || !finePointerQuery.matches || !target) {
                return;
            }

            const text = (target.dataset.tooltip || "").trim();
            if (!text || target.disabled) {
                return;
            }

            activeTooltipTarget = target;
            cursorTooltip.textContent = text;
            cursorTooltip.classList.add("visible");

            if (typeof clientX === "number" && typeof clientY === "number") {
                tooltipPointerX = clientX;
                tooltipPointerY = clientY;
            } else {
                const rect = target.getBoundingClientRect();
                tooltipPointerX = rect.left + rect.width / 2;
                tooltipPointerY = rect.top + rect.height / 2;
            }

            updateCursorTooltipPosition();
        }

        function hideCursorTooltip() {
            if (!cursorTooltip) {
                return;
            }

            activeTooltipTarget = null;
            cursorTooltip.classList.remove("visible");
            cursorTooltip.style.left = "-9999px";
            cursorTooltip.style.top = "-9999px";
        }

        function initCursorTooltips() {
            if (!cursorTooltip) {
                return;
            }

            document.addEventListener("pointerover", (event) => {
                const target = event.target.closest("[data-tooltip]");
                if (!target || target === activeTooltipTarget) {
                    return;
                }
                showCursorTooltip(target, event.clientX, event.clientY);
            });

            document.addEventListener("pointermove", (event) => {
                if (!activeTooltipTarget) {
                    return;
                }
                tooltipPointerX = event.clientX;
                tooltipPointerY = event.clientY;
                updateCursorTooltipPosition();
            }, { passive: true });

            document.addEventListener("pointerout", (event) => {
                if (!activeTooltipTarget) {
                    return;
                }

                const leavingTarget = event.target.closest("[data-tooltip]");
                if (leavingTarget !== activeTooltipTarget) {
                    return;
                }

                const relatedTarget = event.relatedTarget instanceof Element
                    ? event.relatedTarget.closest("[data-tooltip]")
                    : null;
                if (relatedTarget === activeTooltipTarget) {
                    return;
                }

                hideCursorTooltip();
            });

            document.addEventListener("scroll", hideCursorTooltip, true);
            document.addEventListener("pointerdown", hideCursorTooltip, true);
            window.addEventListener("blur", hideCursorTooltip);
            finePointerQuery.addEventListener("change", (event) => {
                if (!event.matches) {
                    hideCursorTooltip();
                }
            });
        }

        function queueBackgroundParallaxFrame() {
            if (parallaxFrame || reducedMotionQuery.matches || !parallaxLayers.length) {
                return;
            }
            parallaxFrame = requestAnimationFrame(applyBackgroundParallax);
        }

        function applyBackgroundParallax() {
            const targetX = parallaxPointerX;
            const targetY = parallaxPointerY + parallaxScrollY;

            currentParallaxX += (targetX - currentParallaxX) * 0.12;
            currentParallaxY += (targetY - currentParallaxY) * 0.12;

            parallaxLayers.forEach((layer) => {
                const depth = Number(layer.dataset.depth || 0);
                layer.style.transform = `translate3d(${(currentParallaxX * depth).toFixed(2)}px, ${(currentParallaxY * depth).toFixed(2)}px, 0)`;
            });

            const needsMoreFrames =
                Math.abs(targetX - currentParallaxX) > 0.08 ||
                Math.abs(targetY - currentParallaxY) > 0.08;

            if (needsMoreFrames) {
                parallaxFrame = requestAnimationFrame(applyBackgroundParallax);
            } else {
                parallaxFrame = null;
            }
        }

        function handleBackgroundPointerMove(event) {
            if (reducedMotionQuery.matches || !parallaxLayers.length) {
                return;
            }

            const normalizedX = (event.clientX / window.innerWidth - 0.5) * 2;
            const normalizedY = (event.clientY / window.innerHeight - 0.5) * 2;
            parallaxPointerX = Math.max(-16, Math.min(16, normalizedX * 16));
            parallaxPointerY = Math.max(-12, Math.min(12, normalizedY * 12));
            queueBackgroundParallaxFrame();
        }

        function resetBackgroundPointerOffset() {
            parallaxPointerX = 0;
            parallaxPointerY = 0;
            queueBackgroundParallaxFrame();
        }

        function handleBackgroundScroll() {
            if (reducedMotionQuery.matches || !parallaxLayers.length) {
                return;
            }

            const normalizedScroll = Math.min(window.scrollY, 800) / 800;
            parallaxScrollY = normalizedScroll * 8;
            queueBackgroundParallaxFrame();
        }

        function initBackgroundParallax() {
            if (reducedMotionQuery.matches || !parallaxLayers.length) {
                return;
            }

            window.addEventListener("pointermove", handleBackgroundPointerMove, { passive: true });
            document.addEventListener("pointerleave", resetBackgroundPointerOffset);
            window.addEventListener("blur", resetBackgroundPointerOffset);
            window.addEventListener("scroll", handleBackgroundScroll, { passive: true });
            handleBackgroundScroll();
        }

        function setActionsMenuOpen(isOpen) {
            if (!actionsMenuButton || !actionsPanel) {
                return;
            }
            actionsPanel.classList.toggle("open", isOpen);
            actionsMenuButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
        }

        function initActionsMenu() {
            if (!actionsMenuButton || !actionsPanel) {
                return;
            }

            actionsMenuButton.addEventListener("click", () => {
                const nextState = !actionsPanel.classList.contains("open");
                setActionsMenuOpen(nextState);
            });

            actionsPanel.addEventListener("click", (event) => {
                if (event.target.closest("button, a")) {
                    setActionsMenuOpen(false);
                }
            });

            document.addEventListener("click", (event) => {
                if (window.innerWidth > 640) {
                    return;
                }

                const wrap = event.target.closest(".actions-wrap");
                if (!wrap) {
                    setActionsMenuOpen(false);
                }
            });

            window.addEventListener("resize", () => {
                if (window.innerWidth > 640) {
                    setActionsMenuOpen(false);
                }
            });
        }

        function shouldTranslateNode(node) {
            const text = node.textContent.trim();
            if (!text) {
                return false;
            }

            const parent = node.parentElement;
            if (!parent) {
                return false;
            }

            if (parent.closest("[data-no-translate]")) {
                return false;
            }

            const tag = parent.tagName;
            return tag !== "SCRIPT" && tag !== "STYLE";
        }

        function collectTranslatableTextNodes() {
            const root = document.querySelector(".resume");
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            let node = walker.nextNode();
            while (node) {
                if (shouldTranslateNode(node)) {
                    nodes.push(node);
                }
                node = walker.nextNode();
            }
            return nodes;
        }

        function captureOriginalTextNodes() {
            const nodes = collectTranslatableTextNodes();
            nodes.forEach((node) => {
                originalTextByNode.set(node, node.textContent);
            });
        }

        async function translateWithGoogle(text, targetLang) {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Google translate request failed: ${response.status}`);
            }

            const payload = await response.json();
            if (!Array.isArray(payload) || !Array.isArray(payload[0])) {
                throw new Error("Unexpected translation payload");
            }

            return payload[0].map((chunk) => chunk[0]).join("").trim();
        }

        async function translateWithMyMemory(text, targetLang) {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ru|${targetLang}`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`MyMemory request failed: ${response.status}`);
            }

            const payload = await response.json();
            return payload?.responseData?.translatedText?.trim();
        }

        async function translateText(text, targetLang) {
            const source = text.trim();
            if (!source) {
                return text;
            }

            const cacheKey = `${targetLang}:${source}`;
            if (translatedCache.has(cacheKey)) {
                return translatedCache.get(cacheKey);
            }

            let translated = source;
            try {
                translated = await translateWithGoogle(source, targetLang);
            } catch (googleError) {
                try {
                    translated = await translateWithMyMemory(source, targetLang) || source;
                } catch (fallbackError) {
                    console.error("Translation failed", googleError, fallbackError);
                    translated = source;
                }
            }

            translatedCache.set(cacheKey, translated);
            return translated;
        }


        function waitForLanguageTransitionFrame(duration) {
            return new Promise((resolve) => {
                window.setTimeout(resolve, duration);
            });
        }

        function applyTextUpdates(updates) {
            updates.forEach(({ node, toText }) => {
                if (node?.isConnected) {
                    node.textContent = toText;
                }
            });
        }

        async function animateLanguageTextTransition(updates) {
            const activeUpdates = updates.filter(({ node, toText }) => {
                return node?.isConnected && typeof toText === "string" && node.textContent !== toText;
            });

            if (!activeUpdates.length || reducedMotionQuery.matches) {
                applyTextUpdates(updates);
                return;
            }

            const animatedParents = new Set();
            activeUpdates.forEach(({ node }) => {
                if (node.parentElement) {
                    animatedParents.add(node.parentElement);
                    node.parentElement.classList.add("language-blur-transition-text");
                }
            });

            await waitForLanguageTransitionFrame(LANGUAGE_BLUR_IN_DURATION);
            applyTextUpdates(updates);
            await new Promise((resolve) => requestAnimationFrame(resolve));
            animatedParents.forEach((parent) => parent.classList.remove("language-blur-transition-text"));
            await waitForLanguageTransitionFrame(LANGUAGE_BLUR_OUT_DURATION);
        }

        function buildLanguageUpdatesForOriginalText() {
            return [...originalTextByNode.entries()].map(([node, text]) => ({
                node,
                toText: text
            }));
        }

        function buildLanguageUpdatesForTranslatedText(translatedMap) {
            return [...originalTextByNode.entries()].map(([node, original]) => {
                const normalized = original.trim();
                const translated = translatedMap.get(normalized);
                return {
                    node,
                    toText: normalized && translated
                        ? original.replace(normalized, translated)
                        : original
                };
            });
        }

        async function setLanguage(targetLanguage) {
            if (isTranslating || currentLanguage === targetLanguage) {
                return;
            }

            const languageButton = document.getElementById("toggleLanguage");
            isTranslating = true;
            setLanguageButtonLoading(languageButton, true);
            languageButton.disabled = true;

            try {
                if (targetLanguage === "ru") {
                    await animateLanguageTextTransition(buildLanguageUpdatesForOriginalText());
                    document.title = baseTitle;
                    document.documentElement.lang = "ru";
                    setLanguageButtonText(languageButton, "EN");
                    languageButton.setAttribute("aria-label", "Переключить язык на английский");
                    currentLanguage = "ru";
                    refreshButtonTooltipsForLanguage();
                    refreshContactTooltipsForLanguage();
                    return;
                }

                const nodes = [...originalTextByNode.keys()];
                const uniqueOriginal = [...new Set(nodes.map((node) => originalTextByNode.get(node).trim()).filter(Boolean))];
                const translatedMap = new Map();

                await Promise.all(uniqueOriginal.map(async (text) => {
                    const translated = await translateText(text, "en");
                    translatedMap.set(text, translated || text);
                }));

                await animateLanguageTextTransition(buildLanguageUpdatesForTranslatedText(translatedMap));

                document.title = await translateText(baseTitle, "en");
                document.documentElement.lang = "en";
                setLanguageButtonText(languageButton, "RU");
                languageButton.setAttribute("aria-label", "Switch language to Russian");
                currentLanguage = "en";
                refreshButtonTooltipsForLanguage();
                refreshContactTooltipsForLanguage();
            } finally {
                languageButton.disabled = false;
                setLanguageButtonLoading(languageButton, false);
                isTranslating = false;
            }
        }

        async function loadResume() {
            const response = await fetch("./resume.json", { cache: "no-store" });
            if (!response.ok) {
                throw new Error("Cannot load resume content");
            }
            return response.json();
        }

        function renderResume(data) {
            loadedResume = data;
            baseTitle = data.meta?.pageTitle || "QA Engineer Resume";
            document.title = baseTitle;
            applyButtonTooltips(data.tooltips || {});
            applyInformationDensity(data.meta || {});
            setProfilePhoto(data.profile || {});
            setTelegramLink(data.profile || {}, data.contacts || []);
            renderCurrentStatus(data.profile || {});
            document.getElementById("name").textContent = data.profile.name;
            document.getElementById("title").textContent = data.profile.title;
            document.getElementById("summary").textContent = data.summary;

            renderContacts(data.contacts || []);

            const skills = document.getElementById("skills");
            skills.innerHTML = "";
            (data.skills || []).forEach((skill) => {
                const item = document.createElement("li");
                item.textContent = skill;
                skills.appendChild(item);
            });

            renderList("experience", data.experience || []);
            renderList("education", data.education || []);
            renderList("certifications", data.certifications || []);

            originalTextByNode.clear();
            captureOriginalTextNodes();
            finishLoadingState();
        }

        function openPhotoModal() {
            const modalPhoto = currentPhotoModalSource || currentPhotoThumbnailSource;
            if (!modalPhoto) {
                return;
            }

            const modal = document.getElementById("photoModal");
            const modalImage = document.getElementById("photoModalImage");
            const profilePhoto = document.getElementById("profilePhoto");
            modalImage.src = modalPhoto;
            modalImage.alt = profilePhoto.alt || "Фото профиля";
            modal.hidden = false;
            document.body.classList.add("modal-open");
        }

        function closePhotoModal() {
            const modal = document.getElementById("photoModal");
            if (modal.hidden) {
                return;
            }
            modal.hidden = true;
            document.body.classList.remove("modal-open");
        }

        async function downloadResumePdf() {
            if (!loadedResume || typeof html2pdf !== "function" || resumeInfoLevel === 0) {
                return;
            }

            const button = document.getElementById("downloadPdf");
            if (button.classList.contains("compact-hidden")) {
                return;
            }

            const originalTooltip = button.dataset.tooltip || getButtonTooltipText("downloadPdf");
            const loadingTooltip = getDownloadPdfLoadingTooltip(currentLanguage);
            setTooltipText(button, loadingTooltip);
            button.disabled = true;

            try {
                setActionsMenuOpen(false);
                closePhotoModal();

                const resumeRoot = document.getElementById("resumeRoot");
                const options = {
                    margin: [12, 12, 12, 12],
                    filename: "cv-qa-kirill-pavlov.pdf",
                    image: { type: "jpeg", quality: 0.98 },
                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: "#f3f7ff",
                        ignoreElements: (element) => {
                            return Boolean(
                                element.closest(".actions-wrap") ||
                                element.closest("#photoModal")
                            );
                        },
                        onclone: (clonedDocument) => {
                            const clonedResume = clonedDocument.getElementById("resumeRoot");
                            if (clonedResume) {
                                clonedResume.classList.remove("loading", "ready");
                            }

                            const revealElements = clonedDocument.querySelectorAll(".reveal");
                            revealElements.forEach((element) => {
                                element.style.animation = "none";
                                element.style.opacity = "1";
                                element.style.transform = "none";
                            });
                        }
                    },
                    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
                    pagebreak: { mode: ["css", "legacy"] }
                };

                await html2pdf().set(options).from(resumeRoot).save();
            } catch (error) {
                console.error("Cannot generate PDF", error);
            } finally {
                setTooltipText(button, originalTooltip);
                button.disabled = false;
            }
        }

        function showError() {
            const root = document.querySelector(".resume");
            root.classList.remove("loading");
            root.innerHTML = "<p class='empty'>Не удалось загрузить данные резюме. Проверьте файл resume.json.</p>";
        }

        document.getElementById("downloadPdf").addEventListener("click", downloadResumePdf);
        document.getElementById("toggleLanguage").addEventListener("click", () => {
            const next = currentLanguage === "ru" ? "en" : "ru";
            setLanguage(next);
        });
        document.getElementById("profilePhotoButton").addEventListener("click", openPhotoModal);
        document.getElementById("photoModalClose").addEventListener("click", closePhotoModal);
        document.querySelector("[data-close-photo]").addEventListener("click", closePhotoModal);
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closePhotoModal();
                setActionsMenuOpen(false);
            }
        });
        applyButtonTooltips({});
        initCursorTooltips();
        initActionsMenu();
        initBackgroundParallax();

        loadResume()
            .then(renderResume)
            .catch(showError);
    </script>
</body>
