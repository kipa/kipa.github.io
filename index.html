<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QA Engineer Resume</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <style>
        :root {
            color-scheme: light;
            --text: #0f172a;
            --muted: #475569;
            --line: #dbe3ef;
            --bg: #f3f7ff;
            --card: #ffffff;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: linear-gradient(155deg, #edf3ff 0%, #f8fbff 44%, #edf3ff 100%);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            max-width: 860px;
            margin: 34px auto 44px;
            padding: 0 20px;
        }

        .liquid-background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .liquid-background::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(46rem 28rem at 12% 12%, rgba(96, 165, 250, 0.28), transparent 72%),
                radial-gradient(40rem 24rem at 88% 18%, rgba(125, 211, 252, 0.28), transparent 74%),
                radial-gradient(34rem 20rem at 50% 88%, rgba(196, 181, 253, 0.26), transparent 72%);
            filter: blur(6px);
        }

        .liquid-background::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(
                120deg,
                rgba(148, 163, 184, 0.04) 0,
                rgba(148, 163, 184, 0.04) 1px,
                transparent 1px,
                transparent 38px
            );
            opacity: 0.35;
        }

        .glass-orb {
            position: absolute;
            border-radius: 999px;
            filter: blur(2px);
            opacity: 0.58;
            animation: liquidFloat 14s ease-in-out infinite;
        }

        .glass-orb.orb-a {
            top: -8%;
            left: -7%;
            width: 360px;
            height: 360px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.84), rgba(96, 165, 250, 0.52) 64%, rgba(59, 130, 246, 0.12) 100%);
        }

        .glass-orb.orb-b {
            top: 14%;
            right: -8%;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle at 42% 30%, rgba(255, 255, 255, 0.82), rgba(125, 211, 252, 0.5) 62%, rgba(14, 165, 233, 0.14) 100%);
            animation-duration: 18s;
            animation-delay: -3s;
        }

        .glass-orb.orb-c {
            bottom: -14%;
            left: 24%;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle at 52% 38%, rgba(255, 255, 255, 0.86), rgba(196, 181, 253, 0.56) 65%, rgba(129, 140, 248, 0.15) 100%);
            animation-duration: 16s;
        }

        .glass-orb.orb-d {
            top: 46%;
            left: 6%;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle at 46% 34%, rgba(255, 255, 255, 0.78), rgba(147, 197, 253, 0.48) 62%, rgba(59, 130, 246, 0.11) 100%);
            animation-duration: 19s;
            animation-delay: -5s;
        }

        .resume {
            background: linear-gradient(155deg, rgba(255, 255, 255, 0.7) 0%, rgba(248, 252, 255, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.82);
            border-radius: 20px;
            padding: 30px;
            box-shadow:
                0 24px 55px rgba(15, 23, 42, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(22px) saturate(125%);
            -webkit-backdrop-filter: blur(22px) saturate(125%);
            position: relative;
            overflow: hidden;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes liquidFloat {
            0% {
                transform: translate3d(0, 0, 0) scale(1);
            }
            50% {
                transform: translate3d(0, -26px, 0) scale(1.05);
            }
            100% {
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        .resume::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 4px;
            background: linear-gradient(90deg, #93c5fd 0%, #3b82f6 45%, #2563eb 100%);
        }

        .reveal {
            opacity: 1;
        }

        .resume.ready .reveal {
            opacity: 0;
            animation: fadeInUp 0.42s ease forwards;
        }

        .resume.ready .reveal:nth-child(1) { animation-delay: 0.02s; }
        .resume.ready .reveal:nth-child(2) { animation-delay: 0.08s; }
        .resume.ready .reveal:nth-child(3) { animation-delay: 0.14s; }
        .resume.ready .reveal:nth-child(4) { animation-delay: 0.2s; }
        .resume.ready .reveal:nth-child(5) { animation-delay: 0.26s; }
        .resume.ready .reveal:nth-child(6) { animation-delay: 0.32s; }
        .resume.ready .reveal:nth-child(7) { animation-delay: 0.38s; }

        .skeleton {
            border-radius: 10px;
            color: transparent;
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, #eef2ff 20%, #dbeafe 50%, #eef2ff 80%);
            background-size: 220% 100%;
            animation: shimmer 1.4s linear infinite;
        }

        .skeleton-title {
            height: 38px;
            width: min(72%, 340px);
        }

        .skeleton-line {
            height: 14px;
            width: 100%;
        }

        .skeleton-line.short {
            width: 62%;
        }

        .skeleton-pill {
            width: 110px;
            height: 28px;
            border-radius: 999px;
            border: 0;
            padding: 0;
        }

        .is-skeleton {
            list-style: none;
        }

        .is-skeleton li {
            list-style: none;
        }

        .resume.loading .icon-btn {
            opacity: 0.55;
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
        }

        .actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .role {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .icon-btn {
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1d4ed8;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            transform: translateY(-1px);
            background: #dbeafe;
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.2);
        }

        .icon-btn:disabled {
            opacity: 0.65;
            cursor: progress;
            transform: none;
            box-shadow: none;
        }

        .lang-btn {
            width: auto;
            min-width: 46px;
            padding: 0 10px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .contacts {
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .contacts li {
            border: 1px solid var(--line);
            background: #f8fafc;
            border-radius: 999px;
            padding: 4px 10px;
        }

        .contacts a,
        .contacts span {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }

        .contacts a:hover {
            border-bottom-color: currentColor;
        }

        section {
            border-top: 1px solid #e2e8f0;
            margin-top: 22px;
            padding-top: 22px;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: #64748b;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        h2::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
        }

        p {
            margin: 0;
        }

        .skills {
            margin: 0;
            padding-left: 18px;
        }

        .skills li + li {
            margin-top: 4px;
        }

        .timeline {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 16px;
        }

        .timeline li {
            border-left: 2px solid #dbeafe;
            padding-left: 14px;
            position: relative;
        }

        .timeline li::before {
            content: "";
            position: absolute;
            left: -6px;
            top: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #60a5fa;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px #bfdbfe;
        }

        .timeline h3 {
            margin: 0;
            font-size: 1rem;
        }

        .timeline .meta {
            margin: 4px 0 6px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .timeline .description {
            margin: 0;
            color: #1f2937;
        }

        .skills.is-skeleton {
            padding-left: 0;
            display: grid;
            gap: 8px;
        }

        .skills.is-skeleton li:nth-child(2) { width: 92%; }
        .skills.is-skeleton li:nth-child(3) { width: 84%; }
        .skills.is-skeleton li:nth-child(4) { width: 76%; }

        .timeline.is-skeleton {
            gap: 12px;
        }

        .timeline.is-skeleton li {
            border: 0;
            padding-left: 0;
            display: grid;
            gap: 7px;
        }

        .timeline.is-skeleton li::before {
            display: none;
        }

        .timeline.is-skeleton li .skeleton-line:first-child {
            width: 58%;
            height: 15px;
        }

        .timeline.is-skeleton li .skeleton-line:last-child {
            width: 86%;
        }

        .empty {
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 12px;
        }

        @media (prefers-reduced-motion: reduce) {
            .skeleton,
            .resume.ready .reveal,
            .glass-orb {
                animation: none !important;
            }

            .resume.ready .reveal {
                opacity: 1;
            }
        }

        @media (max-width: 640px) {
            .container {
                margin-top: 20px;
            }

            .resume {
                padding: 22px;
                border-radius: 14px;
            }

            .glass-orb {
                opacity: 0.42;
                filter: blur(3px);
            }

            .glass-orb.orb-a,
            .glass-orb.orb-b {
                width: 260px;
                height: 260px;
            }

            .glass-orb.orb-c {
                width: 300px;
                height: 300px;
                left: 10%;
            }

            h1 {
                font-size: 1.7rem;
            }

            .header {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="liquid-background" aria-hidden="true">
        <span class="glass-orb orb-a"></span>
        <span class="glass-orb orb-b"></span>
        <span class="glass-orb orb-c"></span>
        <span class="glass-orb orb-d"></span>
    </div>
    <main class="container">
        <article class="resume loading" id="resumeRoot">
            <header class="header reveal">
                <div>
                    <h1 id="name" class="skeleton skeleton-title"></h1>
                    <p class="role skeleton skeleton-line short" id="title"></p>
                </div>
                <div class="actions">
                    <button id="toggleLanguage" class="icon-btn lang-btn" type="button" title="Switch to English" aria-label="Переключить язык на английский" data-no-translate>
                        EN
                    </button>
                    <button id="downloadPdf" class="icon-btn" type="button" title="Скачать PDF" aria-label="Скачать резюме в PDF" data-no-translate>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M12 3V14M12 14L7.5 9.5M12 14L16.5 9.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path>
                            <path d="M5 16.5V18.2C5 19.1941 5.80589 20 6.8 20H17.2C18.1941 20 19 19.1941 19 18.2V16.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
                        </svg>
                    </button>
                </div>
            </header>
            <ul class="contacts is-skeleton reveal" id="contacts">
                <li class="skeleton skeleton-pill"></li>
                <li class="skeleton skeleton-pill"></li>
                <li class="skeleton skeleton-pill"></li>
                <li class="skeleton skeleton-pill"></li>
            </ul>

            <section class="reveal">
                <h2>О себе</h2>
                <p id="summary" class="skeleton skeleton-line"></p>
            </section>

            <section class="reveal">
                <h2>Ключевые навыки</h2>
                <ul class="skills is-skeleton" id="skills">
                    <li class="skeleton skeleton-line"></li>
                    <li class="skeleton skeleton-line"></li>
                    <li class="skeleton skeleton-line"></li>
                    <li class="skeleton skeleton-line"></li>
                </ul>
            </section>

            <section class="reveal">
                <h2>Опыт работы</h2>
                <ul class="timeline is-skeleton" id="experience">
                    <li>
                        <span class="skeleton skeleton-line"></span>
                        <span class="skeleton skeleton-line"></span>
                    </li>
                    <li>
                        <span class="skeleton skeleton-line"></span>
                        <span class="skeleton skeleton-line"></span>
                    </li>
                </ul>
            </section>

            <section class="reveal">
                <h2>Образование</h2>
                <ul class="timeline is-skeleton" id="education">
                    <li>
                        <span class="skeleton skeleton-line"></span>
                        <span class="skeleton skeleton-line"></span>
                    </li>
                </ul>
            </section>

            <section class="reveal">
                <h2>Сертификаты</h2>
                <ul class="timeline is-skeleton" id="certifications">
                    <li>
                        <span class="skeleton skeleton-line"></span>
                        <span class="skeleton skeleton-line"></span>
                    </li>
                </ul>
            </section>
        </article>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        let loadedResume = null;
        let currentLanguage = "ru";
        let isTranslating = false;
        let baseTitle = "QA Engineer Resume";
        const originalTextByNode = new Map();
        const translatedCache = new Map();

        function createTimelineItem(item) {
            const li = document.createElement("li");

            const heading = document.createElement("h3");
            heading.textContent = item.position || item.program || item.name || "";
            li.appendChild(heading);

            const meta = document.createElement("p");
            meta.className = "meta";
            meta.textContent = [item.company || item.school || item.issuer, item.period]
                .filter(Boolean)
                .join(" - ");
            li.appendChild(meta);

            if (item.description) {
                const description = document.createElement("p");
                description.className = "description";
                description.textContent = item.description;
                li.appendChild(description);
            }

            return li;
        }

        function renderContacts(contacts) {
            const contactsList = document.getElementById("contacts");
            contactsList.classList.remove("is-skeleton");
            contactsList.innerHTML = "";

            contacts.forEach((contact) => {
                const item = document.createElement("li");
                if (contact.href) {
                    const link = document.createElement("a");
                    link.href = contact.href;
                    link.textContent = contact.label;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    item.appendChild(link);
                } else {
                    const text = document.createElement("span");
                    text.textContent = contact.label;
                    item.appendChild(text);
                }
                contactsList.appendChild(item);
            });
        }

        function renderList(id, data) {
            const list = document.getElementById(id);
            list.classList.remove("is-skeleton");
            list.innerHTML = "";
            data.forEach((item) => list.appendChild(createTimelineItem(item)));
        }

        function finishLoadingState() {
            const root = document.getElementById("resumeRoot");
            const name = document.getElementById("name");
            const title = document.getElementById("title");
            const summary = document.getElementById("summary");
            const skills = document.getElementById("skills");

            name.classList.remove("skeleton", "skeleton-title");
            title.classList.remove("skeleton", "skeleton-line", "short");
            summary.classList.remove("skeleton", "skeleton-line");
            skills.classList.remove("is-skeleton");

            requestAnimationFrame(() => {
                root.classList.remove("loading");
                root.classList.add("ready");
            });
        }

        function shouldTranslateNode(node) {
            const text = node.textContent.trim();
            if (!text) {
                return false;
            }

            const parent = node.parentElement;
            if (!parent) {
                return false;
            }

            if (parent.closest("[data-no-translate]")) {
                return false;
            }

            const tag = parent.tagName;
            return tag !== "SCRIPT" && tag !== "STYLE";
        }

        function collectTranslatableTextNodes() {
            const root = document.querySelector(".resume");
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            let node = walker.nextNode();
            while (node) {
                if (shouldTranslateNode(node)) {
                    nodes.push(node);
                }
                node = walker.nextNode();
            }
            return nodes;
        }

        function captureOriginalTextNodes() {
            const nodes = collectTranslatableTextNodes();
            nodes.forEach((node) => {
                originalTextByNode.set(node, node.textContent);
            });
        }

        async function translateWithGoogle(text, targetLang) {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Google translate request failed: ${response.status}`);
            }

            const payload = await response.json();
            if (!Array.isArray(payload) || !Array.isArray(payload[0])) {
                throw new Error("Unexpected translation payload");
            }

            return payload[0].map((chunk) => chunk[0]).join("").trim();
        }

        async function translateWithMyMemory(text, targetLang) {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ru|${targetLang}`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`MyMemory request failed: ${response.status}`);
            }

            const payload = await response.json();
            return payload?.responseData?.translatedText?.trim();
        }

        async function translateText(text, targetLang) {
            const source = text.trim();
            if (!source) {
                return text;
            }

            const cacheKey = `${targetLang}:${source}`;
            if (translatedCache.has(cacheKey)) {
                return translatedCache.get(cacheKey);
            }

            let translated = source;
            try {
                translated = await translateWithGoogle(source, targetLang);
            } catch (googleError) {
                try {
                    translated = await translateWithMyMemory(source, targetLang) || source;
                } catch (fallbackError) {
                    console.error("Translation failed", googleError, fallbackError);
                    translated = source;
                }
            }

            translatedCache.set(cacheKey, translated);
            return translated;
        }

        async function setLanguage(targetLanguage) {
            if (isTranslating || currentLanguage === targetLanguage) {
                return;
            }

            const languageButton = document.getElementById("toggleLanguage");
            isTranslating = true;
            languageButton.disabled = true;

            try {
                if (targetLanguage === "ru") {
                    for (const [node, text] of originalTextByNode.entries()) {
                        node.textContent = text;
                    }
                    document.title = baseTitle;
                    document.documentElement.lang = "ru";
                    languageButton.textContent = "EN";
                    languageButton.title = "Switch to English";
                    languageButton.setAttribute("aria-label", "Переключить язык на английский");
                    currentLanguage = "ru";
                    return;
                }

                const nodes = [...originalTextByNode.keys()];
                const uniqueOriginal = [...new Set(nodes.map((node) => originalTextByNode.get(node).trim()).filter(Boolean))];
                const translatedMap = new Map();

                await Promise.all(uniqueOriginal.map(async (text) => {
                    const translated = await translateText(text, "en");
                    translatedMap.set(text, translated || text);
                }));

                nodes.forEach((node) => {
                    const original = originalTextByNode.get(node);
                    const normalized = original.trim();
                    const translated = translatedMap.get(normalized);
                    if (normalized && translated) {
                        node.textContent = original.replace(normalized, translated);
                    }
                });

                document.title = await translateText(baseTitle, "en");
                document.documentElement.lang = "en";
                languageButton.textContent = "RU";
                languageButton.title = "Switch to Russian";
                languageButton.setAttribute("aria-label", "Switch language to Russian");
                currentLanguage = "en";
            } finally {
                languageButton.disabled = false;
                isTranslating = false;
            }
        }

        async function loadResume() {
            const response = await fetch("./resume.json", { cache: "no-store" });
            if (!response.ok) {
                throw new Error("Cannot load resume content");
            }
            return response.json();
        }

        function renderResume(data) {
            loadedResume = data;
            baseTitle = data.meta?.pageTitle || "QA Engineer Resume";
            document.title = baseTitle;
            document.getElementById("name").textContent = data.profile.name;
            document.getElementById("title").textContent = data.profile.title;
            document.getElementById("summary").textContent = data.summary;

            renderContacts(data.contacts || []);

            const skills = document.getElementById("skills");
            skills.innerHTML = "";
            (data.skills || []).forEach((skill) => {
                const item = document.createElement("li");
                item.textContent = skill;
                skills.appendChild(item);
            });

            renderList("experience", data.experience || []);
            renderList("education", data.education || []);
            renderList("certifications", data.certifications || []);

            originalTextByNode.clear();
            captureOriginalTextNodes();
            finishLoadingState();
        }

        async function downloadResumePdf() {
            if (!loadedResume) {
                return;
            }

            const resumeRoot = document.querySelector(".resume");
            const button = document.getElementById("downloadPdf");
            const originalTitle = button.title;
            button.title = "Генерация PDF...";
            button.disabled = true;

            const options = {
                margin: [12, 12, 12, 12],
                filename: "cv-qa-kirill-pavlov.pdf",
                image: { type: "jpeg", quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    ignoreElements: (element) => element.hasAttribute("data-no-translate")
                },
                jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
                pagebreak: { mode: ["css", "legacy"] }
            };

            try {
                await html2pdf().set(options).from(resumeRoot).save();
            } catch (error) {
                console.error("Cannot generate PDF", error);
            } finally {
                button.title = originalTitle;
                button.disabled = false;
            }
        }

        function showError() {
            const root = document.querySelector(".resume");
            root.classList.remove("loading");
            root.innerHTML = "<p class='empty'>Не удалось загрузить данные резюме. Проверьте файл resume.json.</p>";
        }

        document.getElementById("downloadPdf").addEventListener("click", downloadResumePdf);
        document.getElementById("toggleLanguage").addEventListener("click", () => {
            const next = currentLanguage === "ru" ? "en" : "ru";
            setLanguage(next);
        });

        loadResume()
            .then(renderResume)
            .catch(showError);
    </script>
</body>
</html>
