<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QA Engineer Resume</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <style>
        :root {
            color-scheme: light;
            --text: #0f172a;
            --muted: #475569;
            --line: #dbe3ef;
            --bg: #f3f7ff;
            --card: #ffffff;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(700px 350px at 100% -10%, #dbeafe 0%, rgba(219, 234, 254, 0) 70%),
                radial-gradient(600px 320px at -10% 0%, #e0e7ff 0%, rgba(224, 231, 255, 0) 72%),
                var(--bg);
            line-height: 1.5;
        }

        .container {
            max-width: 1240px;
            margin: 34px auto;
            padding: 0 20px;
        }

        .layout {
            display: block;
        }

        .resume {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 16px 45px rgba(15, 23, 42, 0.08);
            position: relative;
            overflow: hidden;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes drift {
            0% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-12px) scale(1.02);
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }

        @keyframes rotateSlow {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .resume::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 4px;
            background: linear-gradient(90deg, #93c5fd 0%, #3b82f6 45%, #2563eb 100%);
        }

        .reveal {
            opacity: 1;
        }

        .resume.ready .reveal {
            opacity: 0;
            animation: fadeInUp 0.42s ease forwards;
        }

        .resume.ready .reveal:nth-child(1) { animation-delay: 0.02s; }
        .resume.ready .reveal:nth-child(2) { animation-delay: 0.08s; }
        .resume.ready .reveal:nth-child(3) { animation-delay: 0.14s; }
        .resume.ready .reveal:nth-child(4) { animation-delay: 0.2s; }
        .resume.ready .reveal:nth-child(5) { animation-delay: 0.26s; }
        .resume.ready .reveal:nth-child(6) { animation-delay: 0.32s; }
        .resume.ready .reveal:nth-child(7) { animation-delay: 0.38s; }

        .skeleton {
            border-radius: 10px;
            color: transparent;
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, #eef2ff 20%, #dbeafe 50%, #eef2ff 80%);
            background-size: 220% 100%;
            animation: shimmer 1.4s linear infinite;
        }

        .skeleton-title {
            height: 38px;
            width: min(72%, 340px);
        }

        .skeleton-line {
            height: 14px;
            width: 100%;
        }

        .skeleton-line.short {
            width: 62%;
        }

        .skeleton-pill {
            width: 110px;
            height: 28px;
            border-radius: 999px;
            border: 0;
            padding: 0;
        }

        .is-skeleton {
            list-style: none;
        }

        .is-skeleton li {
            list-style: none;
        }

        .resume.loading .icon-btn {
            opacity: 0.55;
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
        }

        .actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .role {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .icon-btn {
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1d4ed8;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            transform: translateY(-1px);
            background: #dbeafe;
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.2);
        }

        .icon-btn:disabled {
            opacity: 0.65;
            cursor: progress;
            transform: none;
            box-shadow: none;
        }

        .lang-btn {
            width: auto;
            min-width: 46px;
            padding: 0 10px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .contacts {
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .contacts li {
            border: 1px solid var(--line);
            background: #f8fafc;
            border-radius: 999px;
            padding: 4px 10px;
        }

        .contacts a,
        .contacts span {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }

        .contacts a:hover {
            border-bottom-color: currentColor;
        }

        section {
            border-top: 1px solid #e2e8f0;
            margin-top: 22px;
            padding-top: 22px;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: #64748b;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        h2::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
        }

        p {
            margin: 0;
        }

        .skills {
            margin: 0;
            padding-left: 18px;
        }

        .skills li + li {
            margin-top: 4px;
        }

        .timeline {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 16px;
        }

        .timeline li {
            border-left: 2px solid #dbeafe;
            padding-left: 14px;
            position: relative;
        }

        .timeline li::before {
            content: "";
            position: absolute;
            left: -6px;
            top: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #60a5fa;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px #bfdbfe;
        }

        .timeline h3 {
            margin: 0;
            font-size: 1rem;
        }

        .timeline .meta {
            margin: 4px 0 6px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .timeline .description {
            margin: 0;
            color: #1f2937;
        }

        .skills.is-skeleton {
            padding-left: 0;
            display: grid;
            gap: 8px;
        }

        .skills.is-skeleton li:nth-child(2) { width: 92%; }
        .skills.is-skeleton li:nth-child(3) { width: 84%; }
        .skills.is-skeleton li:nth-child(4) { width: 76%; }

        .timeline.is-skeleton {
            gap: 12px;
        }

        .timeline.is-skeleton li {
            border: 0;
            padding-left: 0;
            display: grid;
            gap: 7px;
        }

        .timeline.is-skeleton li::before {
            display: none;
        }

        .timeline.is-skeleton li .skeleton-line:first-child {
            width: 58%;
            height: 15px;
        }

        .timeline.is-skeleton li .skeleton-line:last-child {
            width: 86%;
        }

        .empty {
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .art-panel {
            display: none;
        }

        @media (min-width: 1024px) {
            .layout {
                display: grid;
                grid-template-columns: minmax(640px, 760px) minmax(290px, 1fr);
                gap: 24px;
                align-items: start;
            }

            .art-panel {
                display: block;
                position: sticky;
                top: 30px;
                min-height: 760px;
                border-radius: 22px;
                overflow: hidden;
                background:
                    radial-gradient(500px 220px at 8% -6%, rgba(191, 219, 254, 0.48), transparent 60%),
                    linear-gradient(180deg, rgba(219, 234, 254, 0.74) 0%, rgba(239, 246, 255, 0.82) 44%, rgba(248, 250, 252, 0.95) 100%);
                border: 1px solid rgba(147, 197, 253, 0.55);
                box-shadow: 0 24px 60px rgba(30, 64, 175, 0.12);
            }

            .art-panel::before {
                content: "";
                position: absolute;
                inset: 0;
                background-image:
                    repeating-linear-gradient(
                        120deg,
                        rgba(148, 163, 184, 0.06) 0,
                        rgba(148, 163, 184, 0.06) 1px,
                        transparent 1px,
                        transparent 32px
                    );
            }

            .art-panel::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0) 52%, rgba(255, 255, 255, 0.35) 100%);
                pointer-events: none;
            }

            .parallax-layer {
                position: absolute;
                inset: 0;
                pointer-events: none;
                will-change: transform;
                transform: translate3d(0, 0, 0);
            }

            .deco-blob {
                position: absolute;
                border-radius: 999px;
                filter: blur(0.4px);
                animation: drift 8s ease-in-out infinite;
            }

            .blob-a {
                top: 8%;
                left: 8%;
                width: 220px;
                height: 220px;
                background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), rgba(147, 197, 253, 0.5) 58%, rgba(59, 130, 246, 0.16) 100%);
            }

            .blob-b {
                top: 34%;
                right: 6%;
                width: 180px;
                height: 180px;
                background: radial-gradient(circle at 42% 32%, rgba(255, 255, 255, 0.9), rgba(125, 211, 252, 0.52) 60%, rgba(14, 165, 233, 0.16) 100%);
                animation-duration: 10s;
            }

            .blob-c {
                bottom: 8%;
                left: 18%;
                width: 240px;
                height: 240px;
                background: radial-gradient(circle at 48% 34%, rgba(255, 255, 255, 0.92), rgba(196, 181, 253, 0.58) 62%, rgba(129, 140, 248, 0.16) 100%);
                animation-duration: 9s;
            }

            .deco-ring {
                position: absolute;
                border-radius: 50%;
                border: 1.5px solid rgba(37, 99, 235, 0.32);
                animation: rotateSlow 28s linear infinite;
            }

            .ring-a {
                width: 320px;
                height: 320px;
                top: 18%;
                left: 20%;
            }

            .ring-b {
                width: 190px;
                height: 190px;
                bottom: 14%;
                right: 18%;
                border-color: rgba(14, 165, 233, 0.38);
                animation-duration: 19s;
                animation-direction: reverse;
            }

            .deco-card {
                position: absolute;
                right: 10%;
                bottom: 11%;
                width: 205px;
                padding: 14px 16px;
                border-radius: 16px;
                border: 1px solid rgba(148, 163, 184, 0.32);
                background: rgba(255, 255, 255, 0.58);
                backdrop-filter: blur(6px);
                box-shadow: 0 12px 26px rgba(59, 130, 246, 0.14);
                color: rgba(30, 64, 175, 0.76);
                font-size: 0.78rem;
                line-height: 1.45;
                letter-spacing: 0.02em;
                animation: drift 7s ease-in-out infinite;
            }

            .deco-card strong {
                display: block;
                margin-bottom: 4px;
                font-size: 0.9rem;
            }

            .deco-stars {
                position: absolute;
                inset: 0;
            }

            .deco-stars span {
                position: absolute;
                width: 4px;
                height: 4px;
                border-radius: 50%;
                background: rgba(59, 130, 246, 0.58);
                box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.08);
                animation: drift 6s ease-in-out infinite;
            }

            .deco-stars span:nth-child(1) { top: 18%; right: 28%; }
            .deco-stars span:nth-child(2) { top: 30%; left: 24%; animation-duration: 7.5s; }
            .deco-stars span:nth-child(3) { top: 58%; right: 18%; animation-duration: 8.2s; }
            .deco-stars span:nth-child(4) { bottom: 20%; left: 30%; animation-duration: 6.6s; }
            .deco-stars span:nth-child(5) { bottom: 38%; right: 40%; animation-duration: 7.9s; }
        }

        @media (prefers-reduced-motion: reduce) {
            .skeleton,
            .resume.ready .reveal,
            .deco-blob,
            .deco-ring,
            .deco-card,
            .deco-stars span {
                animation: none !important;
            }

            .resume.ready .reveal {
                opacity: 1;
            }
        }

        @media (max-width: 640px) {
            .resume {
                padding: 22px;
                border-radius: 14px;
            }

            h1 {
                font-size: 1.7rem;
            }

            .header {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="layout">
            <article class="resume loading" id="resumeRoot">
                <header class="header reveal">
                    <div>
                        <h1 id="name" class="skeleton skeleton-title"></h1>
                        <p class="role skeleton skeleton-line short" id="title"></p>
                    </div>
                    <div class="actions">
                        <button id="toggleLanguage" class="icon-btn lang-btn" type="button" title="Switch to English" aria-label="Переключить язык на английский" data-no-translate>
                            EN
                        </button>
                        <button id="downloadPdf" class="icon-btn" type="button" title="Скачать PDF" aria-label="Скачать резюме в PDF" data-no-translate>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M12 3V14M12 14L7.5 9.5M12 14L16.5 9.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M5 16.5V18.2C5 19.1941 5.80589 20 6.8 20H17.2C18.1941 20 19 19.1941 19 18.2V16.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
                            </svg>
                        </button>
                    </div>
                </header>
                <ul class="contacts is-skeleton reveal" id="contacts">
                    <li class="skeleton skeleton-pill"></li>
                    <li class="skeleton skeleton-pill"></li>
                    <li class="skeleton skeleton-pill"></li>
                    <li class="skeleton skeleton-pill"></li>
                </ul>

                <section class="reveal">
                    <h2>О себе</h2>
                    <p id="summary" class="skeleton skeleton-line"></p>
                </section>

                <section class="reveal">
                    <h2>Ключевые навыки</h2>
                    <ul class="skills is-skeleton" id="skills">
                        <li class="skeleton skeleton-line"></li>
                        <li class="skeleton skeleton-line"></li>
                        <li class="skeleton skeleton-line"></li>
                        <li class="skeleton skeleton-line"></li>
                    </ul>
                </section>

                <section class="reveal">
                    <h2>Опыт работы</h2>
                    <ul class="timeline is-skeleton" id="experience">
                        <li>
                            <span class="skeleton skeleton-line"></span>
                            <span class="skeleton skeleton-line"></span>
                        </li>
                        <li>
                            <span class="skeleton skeleton-line"></span>
                            <span class="skeleton skeleton-line"></span>
                        </li>
                    </ul>
                </section>

                <section class="reveal">
                    <h2>Образование</h2>
                    <ul class="timeline is-skeleton" id="education">
                        <li>
                            <span class="skeleton skeleton-line"></span>
                            <span class="skeleton skeleton-line"></span>
                        </li>
                    </ul>
                </section>

                <section class="reveal">
                    <h2>Сертификаты</h2>
                    <ul class="timeline is-skeleton" id="certifications">
                        <li>
                            <span class="skeleton skeleton-line"></span>
                            <span class="skeleton skeleton-line"></span>
                        </li>
                    </ul>
                </section>
            </article>

            <aside id="decorPanel" class="art-panel" aria-hidden="true">
                <div class="parallax-layer" data-parallax="0.36">
                    <div class="deco-blob blob-a"></div>
                </div>
                <div class="parallax-layer" data-parallax="-0.22">
                    <div class="deco-blob blob-b"></div>
                </div>
                <div class="parallax-layer" data-parallax="0.2">
                    <div class="deco-blob blob-c"></div>
                </div>
                <div class="parallax-layer" data-parallax="0.13">
                    <div class="deco-ring ring-a"></div>
                    <div class="deco-ring ring-b"></div>
                </div>
                <div class="parallax-layer" data-parallax="0.26">
                    <div class="deco-card">
                        <strong>Quality First</strong>
                        Тестирование как дизайн надежности: аккуратно, быстро, предсказуемо.
                    </div>
                </div>
                <div class="parallax-layer deco-stars" data-parallax="0.17">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </aside>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        let loadedResume = null;
        let currentLanguage = "ru";
        let isTranslating = false;
        let baseTitle = "QA Engineer Resume";
        const originalTextByNode = new Map();
        const translatedCache = new Map();
        const decorPanel = document.getElementById("decorPanel");
        const parallaxLayers = decorPanel ? [...decorPanel.querySelectorAll(".parallax-layer")] : [];
        const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        let pointerOffsetX = 0;
        let pointerOffsetY = 0;
        let scrollOffsetY = 0;
        let currentParallaxX = 0;
        let currentParallaxY = 0;
        let parallaxFrame = null;

        function createTimelineItem(item) {
            const li = document.createElement("li");

            const heading = document.createElement("h3");
            heading.textContent = item.position || item.program || item.name || "";
            li.appendChild(heading);

            const meta = document.createElement("p");
            meta.className = "meta";
            meta.textContent = [item.company || item.school || item.issuer, item.period]
                .filter(Boolean)
                .join(" - ");
            li.appendChild(meta);

            if (item.description) {
                const description = document.createElement("p");
                description.className = "description";
                description.textContent = item.description;
                li.appendChild(description);
            }

            return li;
        }

        function renderContacts(contacts) {
            const contactsList = document.getElementById("contacts");
            contactsList.classList.remove("is-skeleton");
            contactsList.innerHTML = "";

            contacts.forEach((contact) => {
                const item = document.createElement("li");
                if (contact.href) {
                    const link = document.createElement("a");
                    link.href = contact.href;
                    link.textContent = contact.label;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    item.appendChild(link);
                } else {
                    const text = document.createElement("span");
                    text.textContent = contact.label;
                    item.appendChild(text);
                }
                contactsList.appendChild(item);
            });
        }

        function renderList(id, data) {
            const list = document.getElementById(id);
            list.classList.remove("is-skeleton");
            list.innerHTML = "";
            data.forEach((item) => list.appendChild(createTimelineItem(item)));
        }

        function finishLoadingState() {
            const root = document.getElementById("resumeRoot");
            const name = document.getElementById("name");
            const title = document.getElementById("title");
            const summary = document.getElementById("summary");
            const skills = document.getElementById("skills");

            name.classList.remove("skeleton", "skeleton-title");
            title.classList.remove("skeleton", "skeleton-line", "short");
            summary.classList.remove("skeleton", "skeleton-line");
            skills.classList.remove("is-skeleton");

            requestAnimationFrame(() => {
                root.classList.remove("loading");
                root.classList.add("ready");
            });
        }

        function queueParallaxFrame() {
            if (parallaxFrame || reducedMotionQuery.matches || !parallaxLayers.length) {
                return;
            }
            parallaxFrame = requestAnimationFrame(applyParallax);
        }

        function applyParallax() {
            const targetX = pointerOffsetX;
            const targetY = pointerOffsetY + scrollOffsetY;

            currentParallaxX += (targetX - currentParallaxX) * 0.12;
            currentParallaxY += (targetY - currentParallaxY) * 0.12;

            parallaxLayers.forEach((layer) => {
                const speed = Number(layer.dataset.parallax || 0);
                layer.style.transform = `translate3d(${(currentParallaxX * speed).toFixed(2)}px, ${(currentParallaxY * speed).toFixed(2)}px, 0)`;
            });

            const needsMoreFrames =
                Math.abs(targetX - currentParallaxX) > 0.08 ||
                Math.abs(targetY - currentParallaxY) > 0.08;

            if (needsMoreFrames) {
                parallaxFrame = requestAnimationFrame(applyParallax);
            } else {
                parallaxFrame = null;
            }
        }

        function handlePanelPointerMove(event) {
            if (!decorPanel || reducedMotionQuery.matches) {
                return;
            }

            const rect = decorPanel.getBoundingClientRect();
            const normalizedX = ((event.clientX - rect.left) / rect.width - 0.5) * 2;
            const normalizedY = ((event.clientY - rect.top) / rect.height - 0.5) * 2;
            pointerOffsetX = Math.max(-22, Math.min(22, normalizedX * 22));
            pointerOffsetY = Math.max(-18, Math.min(18, normalizedY * 18));
            queueParallaxFrame();
        }

        function handlePanelPointerLeave() {
            pointerOffsetX = 0;
            pointerOffsetY = 0;
            queueParallaxFrame();
        }

        function handlePanelScrollParallax() {
            if (!decorPanel || reducedMotionQuery.matches) {
                return;
            }

            const rect = decorPanel.getBoundingClientRect();
            const viewportCenter = window.innerHeight / 2;
            const panelCenter = rect.top + rect.height / 2;
            const offset = (viewportCenter - panelCenter) / window.innerHeight;
            scrollOffsetY = Math.max(-12, Math.min(12, offset * 30));
            queueParallaxFrame();
        }

        function initDecorPanelEffects() {
            if (!decorPanel || reducedMotionQuery.matches) {
                return;
            }

            decorPanel.addEventListener("pointermove", handlePanelPointerMove);
            decorPanel.addEventListener("pointerleave", handlePanelPointerLeave);
            window.addEventListener("scroll", handlePanelScrollParallax, { passive: true });
            window.addEventListener("resize", handlePanelScrollParallax);
            handlePanelScrollParallax();
        }

        function shouldTranslateNode(node) {
            const text = node.textContent.trim();
            if (!text) {
                return false;
            }

            const parent = node.parentElement;
            if (!parent) {
                return false;
            }

            if (parent.closest("[data-no-translate]")) {
                return false;
            }

            const tag = parent.tagName;
            return tag !== "SCRIPT" && tag !== "STYLE";
        }

        function collectTranslatableTextNodes() {
            const root = document.querySelector(".resume");
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            let node = walker.nextNode();
            while (node) {
                if (shouldTranslateNode(node)) {
                    nodes.push(node);
                }
                node = walker.nextNode();
            }
            return nodes;
        }

        function captureOriginalTextNodes() {
            const nodes = collectTranslatableTextNodes();
            nodes.forEach((node) => {
                originalTextByNode.set(node, node.textContent);
            });
        }

        async function translateWithGoogle(text, targetLang) {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Google translate request failed: ${response.status}`);
            }

            const payload = await response.json();
            if (!Array.isArray(payload) || !Array.isArray(payload[0])) {
                throw new Error("Unexpected translation payload");
            }

            return payload[0].map((chunk) => chunk[0]).join("").trim();
        }

        async function translateWithMyMemory(text, targetLang) {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ru|${targetLang}`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`MyMemory request failed: ${response.status}`);
            }

            const payload = await response.json();
            return payload?.responseData?.translatedText?.trim();
        }

        async function translateText(text, targetLang) {
            const source = text.trim();
            if (!source) {
                return text;
            }

            const cacheKey = `${targetLang}:${source}`;
            if (translatedCache.has(cacheKey)) {
                return translatedCache.get(cacheKey);
            }

            let translated = source;
            try {
                translated = await translateWithGoogle(source, targetLang);
            } catch (googleError) {
                try {
                    translated = await translateWithMyMemory(source, targetLang) || source;
                } catch (fallbackError) {
                    console.error("Translation failed", googleError, fallbackError);
                    translated = source;
                }
            }

            translatedCache.set(cacheKey, translated);
            return translated;
        }

        async function setLanguage(targetLanguage) {
            if (isTranslating || currentLanguage === targetLanguage) {
                return;
            }

            const languageButton = document.getElementById("toggleLanguage");
            isTranslating = true;
            languageButton.disabled = true;

            try {
                if (targetLanguage === "ru") {
                    for (const [node, text] of originalTextByNode.entries()) {
                        node.textContent = text;
                    }
                    document.title = baseTitle;
                    document.documentElement.lang = "ru";
                    languageButton.textContent = "EN";
                    languageButton.title = "Switch to English";
                    languageButton.setAttribute("aria-label", "Переключить язык на английский");
                    currentLanguage = "ru";
                    return;
                }

                const nodes = [...originalTextByNode.keys()];
                const uniqueOriginal = [...new Set(nodes.map((node) => originalTextByNode.get(node).trim()).filter(Boolean))];
                const translatedMap = new Map();

                await Promise.all(uniqueOriginal.map(async (text) => {
                    const translated = await translateText(text, "en");
                    translatedMap.set(text, translated || text);
                }));

                nodes.forEach((node) => {
                    const original = originalTextByNode.get(node);
                    const normalized = original.trim();
                    const translated = translatedMap.get(normalized);
                    if (normalized && translated) {
                        node.textContent = original.replace(normalized, translated);
                    }
                });

                document.title = await translateText(baseTitle, "en");
                document.documentElement.lang = "en";
                languageButton.textContent = "RU";
                languageButton.title = "Switch to Russian";
                languageButton.setAttribute("aria-label", "Switch language to Russian");
                currentLanguage = "en";
            } finally {
                languageButton.disabled = false;
                isTranslating = false;
            }
        }

        async function loadResume() {
            const response = await fetch("./resume.json", { cache: "no-store" });
            if (!response.ok) {
                throw new Error("Cannot load resume content");
            }
            return response.json();
        }

        function renderResume(data) {
            loadedResume = data;
            baseTitle = data.meta?.pageTitle || "QA Engineer Resume";
            document.title = baseTitle;
            document.getElementById("name").textContent = data.profile.name;
            document.getElementById("title").textContent = data.profile.title;
            document.getElementById("summary").textContent = data.summary;

            renderContacts(data.contacts || []);

            const skills = document.getElementById("skills");
            skills.innerHTML = "";
            (data.skills || []).forEach((skill) => {
                const item = document.createElement("li");
                item.textContent = skill;
                skills.appendChild(item);
            });

            renderList("experience", data.experience || []);
            renderList("education", data.education || []);
            renderList("certifications", data.certifications || []);

            originalTextByNode.clear();
            captureOriginalTextNodes();
            finishLoadingState();
        }

        async function downloadResumePdf() {
            if (!loadedResume) {
                return;
            }

            const resumeRoot = document.querySelector(".resume");
            const button = document.getElementById("downloadPdf");
            const originalTitle = button.title;
            button.title = "Генерация PDF...";
            button.disabled = true;

            const options = {
                margin: [12, 12, 12, 12],
                filename: "cv-qa-kirill-pavlov.pdf",
                image: { type: "jpeg", quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    ignoreElements: (element) => element.hasAttribute("data-no-translate")
                },
                jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
                pagebreak: { mode: ["css", "legacy"] }
            };

            try {
                await html2pdf().set(options).from(resumeRoot).save();
            } catch (error) {
                console.error("Cannot generate PDF", error);
            } finally {
                button.title = originalTitle;
                button.disabled = false;
            }
        }

        function showError() {
            const root = document.querySelector(".resume");
            root.classList.remove("loading");
            root.innerHTML = "<p class='empty'>Не удалось загрузить данные резюме. Проверьте файл resume.json.</p>";
        }

        document.getElementById("downloadPdf").addEventListener("click", downloadResumePdf);
        document.getElementById("toggleLanguage").addEventListener("click", () => {
            const next = currentLanguage === "ru" ? "en" : "ru";
            setLanguage(next);
        });
        initDecorPanelEffects();

        loadResume()
            .then(renderResume)
            .catch(showError);
    </script>
</body>
</html>
